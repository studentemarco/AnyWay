<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyWay</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <style>
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
        .search-container {
            background-color: #f8f9fa;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid #e9ecef;
        }
        .card {
            transition: transform 0.2s;
            margin-bottom: 0px;
            min-width: 20rem;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .navbar{
            background: #1a4672;
        }

        :root {
            --primary: #1a4672; /* Sostituisci con il codice esadecimale del colore che desideri */
            --bs-primary-rgb: var(--primary); /* Aggiorna anche la variabile per i valori RGB se necessario */
        }

        .bg-primary {
            background-color: var(--primary) !important;
          }

    </style>
</head>
<body>
    <!-- Titolo -->
    <div class="container-fluid bg-primary text-white py-4">
        <div class="d-flex justify-content-center">
            <img src="./static/media/AWBetaLogo.png" alt="AnyWay Beta Logo" style="width: 50%; max-width: 20rem">
        </div>
        <p class="text-center lead">Visualizza e cerca tra tutte le mappe disponibili</p>
    </div>

    <!-- Barra di ricerca -->
    <div class="search-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="input-group">
                        <input type="text" id="searchInput" class="form-control" placeholder="Cerca una mappa per nome..." aria-label="Cerca mappa">
                        <button class="btn btn-outline-secondary" type="button" id="searchButton">
                            <i class="bi bi-search"></i> Cerca
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Elenco cards -->
    <div class="container">
        <div class="d-flex flex-wrap justify-content-center gap-3" id="mapsContainer">
            <!-- Le cards verranno generate dinamicamente con JavaScript -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>

        window.mappe = 0;

        async function getMaps()
        {
            const [mappe] = await Promise.all([
                fetch('/maps'),
            ])

            let m = await mappe.json()

            window.mappe = m
        }

        async function getFloor(id)
        {
            const [floors] = await Promise.all([
                fetch(`/floorsJson/?id=${id}`),
            ])

            let f = await floors.json()

            return f[0];
        }

        async function getImage(id, floor)
        {
            const imageUrl = `/map_image/?id=${id}&floor=${floor}`;

            return imageUrl;
        }

        // Funzione per generare le cards delle mappe
        async function generateMapCards(mapsData) {

            console.log("4", mapsData)

            const container = document.getElementById('mapsContainer');
            container.innerHTML = '';
            
            if (mapsData.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-map display-1 text-muted"></i>
                        <h3 class="text-muted mt-3">Nessuna mappa trovata</h3>
                        <p>Prova a modificare i termini di ricerca</p>
                    </div>
                `;
                return;
            }
            
            for (const mappa of mapsData) {
                const pianoTerra = await getFloor(mappa.id);
                const imageUrl = await getImage(mappa.id, pianoTerra.floor);
        
                const card = document.createElement('div');
                card.className = 'col-md-6 col-lg-4 col-xl-3';
                card.innerHTML = `
                    <a href="/travelMap?id=${mappa.id}&name=${mappa.name}" class="text-decoration-none">
                        <div class="card h-100">
                            <div class="card-body">
                                <img src="${imageUrl}" class="card-img-top" alt="${mappa.nome}">
                            </div>
                            <div class="card-footer bg-white">
                                <h5 class="card-title">${mappa.name}</h5>
                                <p class="card-text">ID Mappa: ${mappa.id}</p>
                            </div>
                        </div>
                    </a>
                `;
                
                container.appendChild(card);
            }
        }

        // Funzione per filtrare le mappe in base alla ricerca
        async function filterMaps(searchText) {


            console.log("ciao", window.mappe)

            if (!searchText) {
                return window.mappe;
            }
            
            const searchLower = searchText.toLowerCase();
            return window.mappe.filter(mappa => 
                mappa.name.toLowerCase().includes(searchLower) || 
                mappa.id.toString().includes(searchText)
            );
        }


        document.addEventListener('DOMContentLoaded', async function() {
            // Genera tutte le cards all'inizio
            await getMaps();
            await generateMapCards(window.mappe);
            
            // Aggiungi gestore eventi per il pulsante di ricerca
            document.getElementById('searchButton').addEventListener('click', async function() {
                const searchText = document.getElementById('searchInput').value;
                const filteredMaps = await filterMaps(searchText);
                console.log("2", filteredMaps);
                generateMapCards(filteredMaps);
            });
            
            // Aggiungi ricerca mentre si digita
            document.getElementById('searchInput').addEventListener('input', async function() {
                const searchText = this.value;
                const filteredMaps = await filterMaps(searchText);
                console.log("3", filteredMaps);
                generateMapCards(filteredMaps);
            });
            
            // Permetti la ricerca premendo Invio
            document.getElementById('searchInput').addEventListener('keypress', async function(e) {
                if (e.key === 'Enter') {
                    const searchText = this.value;
                    const filteredMaps = await filterMaps(searchText);
                    console.log("1", filteredMaps);
                    generateMapCards(filteredMaps);
                }
            });
        });
    </script>
</body>
</html>
